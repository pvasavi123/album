<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rahul &amp; Sneha: Our Forever Journey</title>

  <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            midnight: '#07080E',
            gold: {
              300: '#F6E05E',
              400: '#ECC94B',
              500: '#D4AF37',
              600: '#B7950B',
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- GSAP 3 & Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #07080E;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    /* Ultra-luxurious Glassmorphism */
    .glass-card {
      background: rgba(13, 15, 25, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(212, 175, 55, 0.28);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(212, 175, 55, 0.05);
    }

    /* Active Center Video Card Glowing Gold Border */
    .active-gold-glow {
      border-color: #D4AF37 !important;
      box-shadow: 0 0 50px rgba(212, 175, 55, 0.5), 0 25px 65px rgba(0, 0, 0, 0.85) !important;
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, #FFF6D6 0%, #D4AF37 50%, #B7950B 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Custom Scrollbar for Modal Story */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #07080E;
    }
    ::-webkit-scrollbar-thumb {
      background: #D4AF37;
      border-radius: 4px;
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden flex flex-col justify-between">

  <!-- Atmospheric Glow Overlays -->
  <div class="absolute inset-0 pointer-events-none bg-[radial-gradient(ellipse_at_50%_45%,rgba(212,175,55,0.08)_0%,transparent_65%)] z-0"></div>
  <div class="absolute top-0 left-0 right-0 h-32 bg-gradient-to-b from-[#07080E] to-transparent pointer-events-none z-10"></div>
  <div class="absolute bottom-0 left-0 right-0 h-36 bg-gradient-to-t from-[#07080E] via-[#07080E]/80 to-transparent pointer-events-none z-10"></div>

  <!-- ========================================== -->
  <!-- 1. TOP HEADER -->

  <!-- ========================================== -->
  <!-- 2. CORE 3D VIDEO CAROUSEL STAGE -->
  <!-- ========================================== -->

      style="transform-style: preserve-3d; perspective: 1200px;"
    >

    </div>
  </main>

  <!-- ========================================== -->

  <!-- ========================================== -->
  <footer class="relative z-30 mx-auto max-w-7xl w-full px-4 sm:px-6 pb-6 flex flex-col sm:flex-row items-center justify-between gap-4">

  <!-- ========================================== -->
  <!-- 4. FULLSCREEN CINEMATIC VIDEO PLAYER MODAL -->

  <!-- ========================================== -->

      <!-- Gold Shimmer Highlight -->
      <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-[#D4AF37] to-transparent"></div>

      <div class="flex items-center justify-between mb-5">
        <div>

        <button id="closeAddModalBtn" class="w-8 h-8 rounded-full border border-white/20 text-white/70 hover:text-white hover:border-[#D4AF37] flex items-center justify-center transition-colors">

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[#F3E5AB]/90 font-medium mb-1 uppercase tracking-wider text-[10px]">Year</label>
            <input 
              type="text" 
              id="inputYear" 
              placeholder="2026" 
              value="2026"

            <input 
              type="text"

              placeholder="Special Day" 
              value="Special Day"
              class="w-full px-3.5 py-2.5 rounded-xl bg-black/60 border border-[#D4AF37]/30 text-white placeholder-white/30 focus:border-[#D4AF37] focus:outline-none transition-colors"

        <div>

          <input 
            type="url" 
            id="inputVideo" 
            required
            placeholder="https://assets.mixkit.co/.../video.mp4"

            class="w-full px-3.5 py-2.5 rounded-xl bg-black/60 border border-[#D4AF37]/30 text-white placeholder-white/30 focus:border-[#D4AF37] focus:outline-none transition-colors"

          <textarea 
            id="inputStory"

            required
            placeholder="Tell the story of what happened in simple, heartfelt words..." 
            class="w-full px-3.5 py-2.5 rounded-xl bg-black/60 border border-[#D4AF37]/30 text-white placeholder-white/30 focus:border-[#D4AF37] focus:outline-none transition-colors resize-none"

        <div class="pt-2 flex items-center justify-end space-x-3">

            type="button" 
            id="cancelAddBtn"
            class="px-4 py-2 rounded-full border border-white/20 text-[#F3E5AB]/70 hover:text-white transition-colors"
          >
            Cancel

          <button 
            type="submit" 
            class="px-6 py-2 rounded-full bg-gradient-to-r from-[#F6E05E] to-[#D4AF37] text-black font-semibold shadow-[0_0_15px_rgba(212,175,55,0.4)] hover:scale-105 active:scale-95 transition-all"

  <!-- ========================================== -->
  <!-- JAVASCRIPT: DATA, GSAP 3D ENGINE & THREE.JS -->
  <!-- ========================================== -->
  <script>
    // -------------------------------------------------------------
    // 1. Rahul & Sneha's Love Story Milestones (With Working Video Clips)
    // -------------------------------------------------------------
    const initialMemories = [
      {
        id: "rs-mem-1",
        year: "2018",
        title: "The First Coffee",
        chapter: "Chapter 1",
        badge: "How We Met",
        videoUrl: "https://assets.mixkit.co/videos/42835/42835-720.mp4",
        poster: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1200&q=80",
        story: "A rainy Sunday evening at our neighborhood cafe. We shared the last empty table, ordered two cappuccinos, and talked until the cafe closed."
      },
      {
        id: "rs-mem-2",
        year: "2020",
        title: "Our First Road Trip",
        chapter: "Chapter 2",
        badge: "Adventure",
        videoUrl: "https://assets.mixkit.co/videos/42825/42825-720.mp4",
        poster: "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=1200&q=80",
        story: "Our first trip out of the city. We lost cell network, played our favorite playlist on repeat, and watched the sunset from the hilltop."
      },
      {
        id: "rs-mem-3",
        year: "2022",
        title: "The Quiet Proposal",
        chapter: "Chapter 3",
        badge: "The Promise",
        videoUrl: "https://assets.mixkit.co/videos/42797/42797-720.mp4",
        poster: "https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?auto=format&fit=crop&w=1200&q=80",
        story: "No stage, no crowd. Just an evening walk by the sea. He stopped, pulled out a ring, and asked to spend forever together."
      },
      {
        id: "rs-mem-4",
        year: "2024",
        title: "Our Wedding Vows",
        chapter: "Chapter 4",
        badge: "The Big Day",
        videoUrl: "https://assets.mixkit.co/videos/42813/42813-720.mp4",
        poster: "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=80",
        story: "November 24, 2024. Surrounded by our parents and closest family, we took our pheras and promised to be partners for life."
      },
      {
        id: "rs-mem-5",
        year: "2024",
        title: "The Reception Dance",
        chapter: "Chapter 5",
        badge: "First Dance",
        videoUrl: "https://assets.mixkit.co/videos/42807/42807-720.mp4",
        poster: "https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?auto=format&fit=crop&w=1200&q=80",
        story: "Our first dance as husband and wife. With all our friends cheering, it still felt like the world was completely quiet around us."
      },
      {
        id: "rs-mem-6",
        year: "2025",
        title: "Keys to Our First Home",
        chapter: "Chapter 6",
        badge: "Our Sanctuary",
        videoUrl: "https://assets.mixkit.co/videos/42823/42823-720.mp4",
        poster: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80",
        story: "Our first apartment together. Sitting on the bare wooden floor, eating takeout from paper plates, and putting our nameplate on the door."
      },
      {
        id: "rs-mem-7",
        year: "2026",
        title: "Everyday Married Life",
        chapter: "Chapter 7",
        badge: "Forever Starts Here",
        videoUrl: "https://assets.mixkit.co/videos/42819/42819-720.mp4",
        poster: "https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=1200&q=80",
        story: "Real marriage is in the small things: grocery runs on Sunday, cooking together after a long work day, and having your favorite person to come home to."
      }
    ];

    let memories = [...initialMemories];
    let currentIndex = 3; // Starts focused on Chapter 4 (Our Wedding Vows - Nov 24, 2024)
    let currentProgress = 3.0; // Fractional progress for smooth lerp
    let targetIndex = 3;

    // -------------------------------------------------------------
    // 2. Floating Golden Stardust Particle System (HTML5 Canvas)
    // -------------------------------------------------------------
    const particleCanvas = document.getElementById('particleCanvas');
    const pCtx = particleCanvas.getContext('2d');
    let pWidth = (particleCanvas.width = window.innerWidth);
    let pHeight = (particleCanvas.height = window.innerHeight);

    const particles = [];
    const pCount = window.innerWidth < 768 ? 45 : 85;
    for (let i = 0; i < pCount; i++) {
      particles.push({
        x: Math.random() * pWidth,
        y: Math.random() * pHeight,
        r: Math.random() * 2.2 + 0.8,
        vx: (Math.random() - 0.5) * 0.35,
        vy: -Math.random() * 0.5 - 0.1,
        alpha: Math.random() * 0.7 + 0.2,
        pulse: Math.random() * 0.02 + 0.01
      });
    }

    function renderParticles() {
      pCtx.clearRect(0, 0, pWidth, pHeight);
      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha += Math.sin(Date.now() * p.pulse) * 0.005;

        if (p.y < 0) p.y = pHeight;
        if (p.x < 0) p.x = pWidth;
        if (p.x > pWidth) p.x = 0;

        const grad = pCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 2);
        grad.addColorStop(0, `rgba(255, 246, 214, ${Math.max(0.1, Math.min(0.9, p.alpha))})`);
        grad.addColorStop(0.5, `rgba(212, 175, 55, ${Math.max(0.05, Math.min(0.6, p.alpha * 0.7))})`);
        grad.addColorStop(1, 'rgba(212, 175, 55, 0)');

        pCtx.fillStyle = grad;
        pCtx.beginPath();
        pCtx.arc(p.x, p.y, p.r * 2, 0, Math.PI * 2);
        pCtx.fill();
      });
      requestAnimationFrame(renderParticles);
    }
    renderParticles();

    window.addEventListener('resize', () => {
      pWidth = particleCanvas.width = window.innerWidth;
      pHeight = particleCanvas.height = window.innerHeight;
    });

    // -------------------------------------------------------------
    // 3. Render 3D Video Cards & Stepper Dots
    // -------------------------------------------------------------
    const stage = document.getElementById('cardsStage');
    const dotsContainer = document.getElementById('dotsContainer');
    const counterText = document.getElementById('counterText');

    function buildCards() {
      stage.innerHTML = '';
      dotsContainer.innerHTML = '';

      memories.forEach((mem, idx) => {
        // Build 3D Card Element
        const card = document.createElement('div');
        card.className = 'spatial-card absolute top-0 left-0 w-full h-full glass-card rounded-3xl p-4 sm:p-6 flex flex-col justify-between cursor-pointer transition-shadow duration-300';
        card.style.transformStyle = 'preserve-3d';
        card.setAttribute('data-index', idx);

        card.innerHTML = `
          <!-- Shimmer Top Edge -->
          <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-[#D4AF37] to-transparent opacity-80"></div>

          <!-- Card Header -->
          <div class="flex items-center justify-between pointer-events-none">
            <div class="flex items-center space-x-2">
              <span class="font-serif text-xl sm:text-2xl font-bold text-[#D4AF37]">${mem.year}</span>
              <span class="h-3 w-[1px] bg-[#D4AF37]/40"></span>
              <span class="text-xs uppercase tracking-widest text-[#F3E5AB]/70 font-semibold font-sans">${mem.chapter}</span>
            </div>
            <span class="px-3 py-1 rounded-full text-[10px] font-sans font-semibold uppercase tracking-wider bg-white/5 border border-[#D4AF37]/30 text-[#F3E5AB]">${mem.badge}</span>
          </div>

          <!-- Video Clip Container -->
          <div class="relative w-full h-48 sm:h-56 rounded-2xl overflow-hidden border border-white/10 my-3 group">
            <video 
              id="card-video-${idx}"
              src="${mem.videoUrl}" 
              poster="${mem.poster}"
              preload="metadata"
              muted 
              loop 
              playsinline 
              class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
            ></video>
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/25 pointer-events-none"></div>

            <!-- Play Overlay Badge -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
              <div class="w-12 h-12 rounded-full bg-black/60 backdrop-blur-md border border-[#D4AF37] flex items-center justify-center text-[#D4AF37] shadow-[0_0_20px_rgba(212,175,55,0.6)] group-hover:scale-110 group-hover:bg-[#D4AF37] group-hover:text-black transition-all">
                <svg class="w-5 h-5 ml-0.5 fill-current" viewBox="0 0 24 24">
                  <path d="M8 5v14l11-7z"/>
                </svg>
              </div>
            </div>

            <!-- Video Status Indicator Tag -->
            <div class="absolute bottom-2.5 left-2.5 px-2.5 py-1 rounded-lg bg-black/60 backdrop-blur-md text-[10px] text-[#F3E5AB] border border-white/10 pointer-events-none flex items-center space-x-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-[#D4AF37] animate-ping"></span>
              <span>Click for Full Screen &amp; Audio</span>
            </div>
          </div>

          <!-- Story Caption -->
          <div class="pointer-events-none">
            <h3 class="font-serif text-lg sm:text-xl font-bold text-white leading-snug">${mem.title}</h3>
            <p class="mt-1 text-xs text-[#F3E5AB]/80 line-clamp-2 leading-relaxed font-sans">${mem.story}</p>
          </div>

          <!-- Bottom Prompt -->
          <div class="pt-2 border-t border-[#D4AF37]/20 flex items-center justify-between text-[11px] text-[#D4AF37] font-sans pointer-events-none">
            <span class="uppercase tracking-wider font-semibold">Relive Memory →</span>
            <span class="text-[10px] text-[#F3E5AB]/50">Rahul &amp; Sneha • ${idx + 1} of ${memories.length}</span>
          </div>
        `;

        // Card Click Handler
        card.addEventListener('click', () => {
          if (idx === currentIndex) {
            openVideoModal(mem);
          } else {
            jumpTo(idx);
          }
        });

        // Hover play preview for the center card
        card.addEventListener('mouseenter', () => {
          if (idx === currentIndex) {
            const vid = document.getElementById(`card-video-${idx}`);
            if (vid) vid.play().catch(() => {});
          }
        });

        stage.appendChild(card);

        // Build Stepper Dot
        const dot = document.createElement('button');
        dot.className = 'h-2 rounded-full transition-all duration-300 ' + (idx === currentIndex ? 'w-6 bg-[#D4AF37] shadow-[0_0_10px_#D4AF37]' : 'w-2 bg-white/20');
        dot.addEventListener('click', () => jumpTo(idx));
        dotsContainer.appendChild(dot);
      });

      updateCounter();
    }

    function updateCounter() {
      counterText.textContent = `Memory ${currentIndex + 1} of ${memories.length}`;
      Array.from(dotsContainer.children).forEach((dot, idx) => {
        dot.className = 'h-2 rounded-full transition-all duration-300 ' + (idx === currentIndex ? 'w-6 bg-[#D4AF37] shadow-[0_0_10px_#D4AF37]' : 'w-2 bg-white/20');
      });
    }

    // -------------------------------------------------------------
    // 4. GSAP 3D Spatial Calculation & Video Playback State
    // -------------------------------------------------------------
    function updateSpatialPositions(progress) {
      const cards = document.querySelectorAll('.spatial-card');
      if (!cards.length) return;

      const isMobile = window.innerWidth < 640;
      const spacingX = isMobile ? 180 : 280;
      const depthZ = isMobile ? 190 : 260;
      const maxTilt = isMobile ? 18 : 25;

      cards.forEach((card, idx) => {
        const diff = idx - progress;
        const absDiff = Math.abs(diff);

        const translateX = diff * spacingX;
        const translateZ = -absDiff * depthZ;
        const rotateY = gsap.utils.clamp(-maxTilt * 1.5, maxTilt * 1.5, -diff * maxTilt);
        const scale = Math.max(0.74, (isMobile ? 1.02 : 1.08) - absDiff * 0.13);
        const opacity = Math.max(0.12, 1.0 - absDiff * 0.34);
        const blurPx = Math.max(0, (absDiff - 0.25) * 5.0);
        const zIndex = Math.round(100 - absDiff * 10);

        card.style.transform = `translateX(${translateX}px) translateZ(${translateZ}px) rotateY(${rotateY}deg) scale(${scale})`;
        card.style.opacity = opacity;
        card.style.filter = blurPx > 0.5 ? `blur(${blurPx}px)` : 'none';
        card.style.zIndex = zIndex;
        card.style.pointerEvents = absDiff < 0.8 ? 'auto' : 'none';

        const vid = document.getElementById(`card-video-${idx}`);

        if (absDiff < 0.35) {
          card.classList.add('active-gold-glow');
          // Auto-play the video clip for the focused center card
          if (vid && vid.paused) {
            vid.play().catch(() => {});
          }
        } else {
          card.classList.remove('active-gold-glow');
          if (vid && !vid.paused) {
            vid.pause();
          }
        }
      });
    }

    // Continuous RAF Lerp Loop with GSAP Damping
    let isDragging = false;
    let startX = 0;
    let lastX = 0;
    let lastTime = 0;
    let velocity = 0;

    function animLoop() {
      requestAnimationFrame(animLoop);

      if (!isDragging) {
        const diff = targetIndex - currentProgress;
        currentProgress += diff * 0.085;

        const rounded = Math.round(currentProgress);
        if (Math.abs(diff) < 0.01 && currentIndex !== rounded) {
          currentIndex = rounded;
          updateCounter();
        }
      }

      updateSpatialPositions(currentProgress);
    }
    animLoop();

    // -------------------------------------------------------------
    // 5. Mouse & Touch Drag Support with Velocity Momentum
    // -------------------------------------------------------------
    const container = document.getElementById('carouselContainer');

    function onDragStart(clientX) {
      isDragging = true;
      startX = clientX;
      lastX = clientX;
      lastTime = performance.now();
      velocity = 0;
    }

    function onDragMove(clientX) {
      if (!isDragging) return;
      const now = performance.now();
      const dt = now - lastTime || 16;
      const dx = clientX - lastX;

      velocity = dx / dt;
      lastX = clientX;
      lastTime = now;

      const factor = window.innerWidth < 640 ? 260 : 380;
      currentProgress = Math.max(-0.2, Math.min(memories.length - 0.8, currentProgress - dx / factor));
    }

    function onDragEnd() {
      if (!isDragging) return;
      isDragging = false;

      const factor = window.innerWidth < 640 ? 260 : 380;
      const momentum = -velocity * 120;
      let finalIndex = Math.round(currentProgress + momentum / factor);
      finalIndex = Math.max(0, Math.min(memories.length - 1, finalIndex));
      targetIndex = finalIndex;
    }

    container.addEventListener('mousedown', (e) => onDragStart(e.clientX));
    window.addEventListener('mousemove', (e) => onDragMove(e.clientX));
    window.addEventListener('mouseup', onDragEnd);

    container.addEventListener('touchstart', (e) => onDragStart(e.touches[0].clientX), { passive: true });
    window.addEventListener('touchmove', (e) => onDragMove(e.touches[0].clientX), { passive: true });
    window.addEventListener('touchend', onDragEnd);

    // Mouse Wheel scrub
    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY || e.deltaX;
      if (Math.abs(delta) > 15) {
        targetIndex = Math.max(0, Math.min(memories.length - 1, targetIndex + (delta > 0 ? 1 : -1)));
      }
    }, { passive: false });

    function jumpTo(idx) {
      targetIndex = Math.max(0, Math.min(memories.length - 1, idx));
    }

    document.getElementById('prevBtn').addEventListener('click', () => jumpTo(currentIndex - 1));
    document.getElementById('nextBtn').addEventListener('click', () => jumpTo(currentIndex + 1));

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') jumpTo(currentIndex - 1);
      if (e.key === 'ArrowRight') jumpTo(currentIndex + 1);
      if (e.key === 'Escape') {
        closeVideoModal();
        closeAddModal();
      }
    });

    // -------------------------------------------------------------
    // 6. Fullscreen Cinematic Video Modal
    // -------------------------------------------------------------
    const videoModal = document.getElementById('videoModal');
    const modalVideo = document.getElementById('modalVideo');
    const modalYear = document.getElementById('modalYear');
    const modalTitle = document.getElementById('modalTitle');
    const modalStory = document.getElementById('modalStory');

    function openVideoModal(mem) {
      modalYear.textContent = mem.year;
      modalTitle.textContent = mem.title;
      modalStory.textContent = mem.story;
      modalVideo.src = mem.videoUrl;
      modalVideo.currentTime = 0;
      videoModal.classList.remove('hidden');
      videoModal.classList.add('flex');
      modalVideo.play().catch(() => {});
    }

    function closeVideoModal() {
      modalVideo.pause();
      modalVideo.src = '';
      videoModal.classList.add('hidden');
      videoModal.classList.remove('flex');
    }

    document.getElementById('closeModalBtn').addEventListener('click', closeVideoModal);
    document.getElementById('closeModalBtn2').addEventListener('click', closeVideoModal);
    videoModal.addEventListener('click', (e) => {
      if (e.target === videoModal) closeVideoModal();
    });

    // "Play Full Wedding Film" button (plays Chapter 4: Our Wedding Vows)
    document.getElementById('watchMovieBtn').addEventListener('click', () => {
      openVideoModal(memories[3]);
    });

    // -------------------------------------------------------------
    // 7. "Add Our Memory" Modal Popup
    // -------------------------------------------------------------
    const addMemoryModal = document.getElementById('addMemoryModal');
    const openAddModalBtn = document.getElementById('openAddModalBtn');
    const closeAddModalBtn = document.getElementById('closeAddModalBtn');
    const cancelAddBtn = document.getElementById('cancelAddBtn');
    const addMemoryForm = document.getElementById('addMemoryForm');

    function openAddModal() {
      addMemoryModal.classList.remove('hidden');
      addMemoryModal.classList.add('flex');
    }

    function closeAddModal() {
      addMemoryModal.classList.add('hidden');
      addMemoryModal.classList.remove('flex');
    }

    openAddModalBtn.addEventListener('click', openAddModal);
    closeAddModalBtn.addEventListener('click', closeAddModal);
    cancelAddBtn.addEventListener('click', closeAddModal);
    addMemoryModal.addEventListener('click', (e) => {
      if (e.target === addMemoryModal) closeAddModal();
    });

    addMemoryForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('inputTitle').value.trim();
      const year = document.getElementById('inputYear').value.trim() || '2026';
      const badge = document.getElementById('inputBadge').value.trim() || 'Our Memory';
      const videoUrl = document.getElementById('inputVideo').value.trim();
      const story = document.getElementById('inputStory').value.trim();

      if (!title || !videoUrl) return;

      const newMem = {
        id: `rs-mem-${Date.now()}`,
        year,
        title,
        chapter: `Chapter ${memories.length + 1}`,
        badge,
        videoUrl,
        poster: 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=80',
        story
      };

      memories.push(newMem);
      buildCards();
      jumpTo(memories.length - 1);
      closeAddModal();
      addMemoryForm.reset();
    });

    // -------------------------------------------------------------
    // 8. Three.js 3D Interactive Wedding Ring Keepsake
    // -------------------------------------------------------------
    const ringCanvas = document.getElementById('ringCanvas');
    if (window.THREE && ringCanvas) {
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
      camera.position.set(0, 0, 4.2);

      const renderer = new THREE.WebGLRenderer({ canvas: ringCanvas, antialias: true, alpha: true });
      renderer.setSize(52, 52);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const ambLight = new THREE.AmbientLight(0xffffff, 1.4);
      scene.add(ambLight);

      const pLight1 = new THREE.PointLight(0xfff6d6, 3, 20);
      pLight1.position.set(3, 4, 3);
      scene.add(pLight1);

      const pLight2 = new THREE.PointLight(0xd4af37, 2, 20);
      pLight2.position.set(-3, -2, 2);
      scene.add(pLight2);

      const ringGroup = new THREE.Group();
      const torusGeo = new THREE.TorusGeometry(1.0, 0.16, 24, 64);
      const goldMat = new THREE.MeshStandardMaterial({
        color: 0xdfbe5b,
        metalness: 0.95,
        roughness: 0.18,
      });
      const ringBand = new THREE.Mesh(torusGeo, goldMat);
      ringGroup.add(ringBand);

      // Solitaire Diamond Gem
      const gemGeo = new THREE.OctahedronGeometry(0.35, 1);
      const gemMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0.05,
        roughness: 0.05,
        transmission: 0.85,
        ior: 2.4,
        transparent: true,
        opacity: 0.95,
      });
      const gemMesh = new THREE.Mesh(gemGeo, gemMat);
      gemMesh.position.set(0, 1.15, 0);
      ringGroup.add(gemMesh);

      // 4 Prongs
      const prongGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.3, 8);
      for (let i = 0; i < 4; i++) {
        const prong = new THREE.Mesh(prongGeo, goldMat);
        const angle = (i * Math.PI) / 2;
        prong.position.set(Math.cos(angle) * 0.18, 1.05, Math.sin(angle) * 0.18);
        ringGroup.add(prong);
      }

      ringGroup.rotation.x = 0.45;
      ringGroup.rotation.y = 0.3;
      scene.add(ringGroup);

      // Auto-spin + 360° mouse drag interaction
      let isRingDragging = false;
      let prevRingX = 0;
      let prevRingY = 0;

      const widget = document.getElementById('ringVaultWidget');
      widget.addEventListener('mousedown', (e) => {
        isRingDragging = true;
        prevRingX = e.clientX;
        prevRingY = e.clientY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isRingDragging) return;
        const dx = e.clientX - prevRingX;
        const dy = e.clientY - prevRingY;
        ringGroup.rotation.y += dx * 0.02;
        ringGroup.rotation.x += dy * 0.02;
        prevRingX = e.clientX;
        prevRingY = e.clientY;
      });

      window.addEventListener('mouseup', () => {
        isRingDragging = false;
      });

      function animateRing() {
        requestAnimationFrame(animateRing);
        if (!isRingDragging) {
          ringGroup.rotation.y += 0.012;
        }
        renderer.render(scene, camera);
      }
      animateRing();
    }

    // Ceremony Audio Vows Alert Feedback
    document.getElementById('audioVowsBtn').addEventListener('click', () => {
      alert("“Rahul & Sneha • Wedding Vow: I promise to choose you every day, to laugh through the storms, to celebrate the quiet evenings, and to be your partner for all of our tomorrows.”");
    });

    // Initial Build
    buildCards();
  </script>
</body>
</html>
